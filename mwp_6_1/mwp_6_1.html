<!DOCTYPE html>
<head>
    <script src="mwp_6_1.js"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.slim.js" integrity="sha256-M+GjhMBfXikM1izMplICCTscIj5hzPCp6uDzaypxtgg=" crossorigin="anonymous">
        const c = require("ansi-colors")

        $('#hello').click(() => {
            hello('홍길동')
        })
        $('#helloWithColorRed').click(() => {
            helloWithColor('홍길동')
        })
        $('#helloWithColorBlue').click(() => {
            helloWithColor('홍길동', c.blue)
        })
        $('#helloWithColorBgCyan').click(() => {
            helloWithColor('홍길동', c.bgCyan)
        })
    </script>
</head>
<body>
    <input type="button" id="hello" value="hello">
    <input type="button" id="helloWithColorRed" value="helloWithColorRed">
    <input type="button" id="helloWithColorBlue" value="helloWithColorBlue">
    <input type="button" id="helloWithColorBgCyan" value="helloWithColorBgCyan">
</body>
