<!DOCTYPE html>
<html>
    <head>
        <title>목록 태그 실습</title>
    </head>
    <body>
        <h1>글머리 기호</h1>
        <ul type="circle">
            <li>아이스크림 먹고싶다</li>
            <li>초밥 먹고싶다</li>
            <li>치킨 먹고싶다</li>
        </ul>
        <ol type="i" start="4">
            <li>아이스크림 먹고싶다</li>
            <li>초밥 먹고싶다</li>
            <li>치킨 먹고싶다</li>
        </ol>
        <dl>
            <dt>먹고싶은 것</dt>
            <dd>아이스크림</dd>
            <dd>초밥</dd>
            <dd>치킨</dd>
        </dl>
    </body>
</html>
