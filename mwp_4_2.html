<!DOCTYPE html>
<html>
    <head>
        <title>박스모델 실습</title>
        <style>
            div {
                border: 3px solid red;
                margin: 1em;
                padding: 1em;
                text-align: center;
                background-color: aliceblue;
            }
            #r1{
                width: 50px;
                height: 50px;
                position: relative;
                left: 100px;
            }
            #r2{
                width: 150px;
                height: 100px;
                position: absolute;
                left: 800px;
                top: 500px;
            }
            #r3{
                width: 500px;
                height: 300px;
                background-image: url('https://lms.suwings.syu.ac.kr/ilos/images/osms/syu/ko/logo.gif?v=20260814');
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
            }
            .g1{
                width: 100px;
                height: 70px;
                display: inline-block;
            }
        </style>
    </head>
    <body>
        <div id="r1"></div>
        <div id="r2"></div>
        <div id="r3"></div>
        <div class="g1"></div>
        <div class="g1"></div>
        <div class="g1"></div>
    </body>
</html>
