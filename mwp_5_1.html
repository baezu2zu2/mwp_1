<!DOCTYPE html>
<head>
    <title>jQuery 실습</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script>
        $(document).ready(function(){
            $('button').click(() => {
                $('h1').css('color', 'red');
                $('p').css('background-color', 'yellow');
                $('img').attr('src', 'https://placehold.co/200x200')
                $('#t1').text('<a href="https://www.syu.ac.kr">text()</a>')
                $('#t2').html('<a href="https://www.syu.ac.kr">html()</a>')
                $('#t1').toggleClass('c1')
            });
        });
    </script>
    <style>
        .c1 {
            color:blue;
        }
    </style>
</head>
<body>
    <h1>jQuery 예제</h1>
    <p>삼육대학교</p>
    <p id="t1">인공지능융합학부</p>
    <p id="t2">웹프로그래밍</p>
    <img><br>
    <img src="https://placehold.co/100x100"><br>
    <button>클릭하세요.</button>
</body>
