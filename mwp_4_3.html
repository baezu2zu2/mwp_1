<!DOCTYPE html>
<html>
    <head>
        <title>input 실습</title>
    </head>
    <body>
        <form name="fm1" method="get" action="">
            아이디 입력 <input type="text" name="txt1" value=""><br>
            암호 입력 <input type="password" name="pw1" value=""><br>
            <input type="button" name="btn1" value="로그인"><br>
            먹고 싶은 것<br>
            <input type="checkbox" name="cb1" value="cv1"> 엽떡
            <input type="checkbox" name="cb2" value="cv2"> 생새우
            <input type="checkbox" name="cb3" value="cv3"> 짜글이<br>
            언제 먹고 싶은지<br>
            <input type="radio" name="rdo1" value="rv1"> 아침
            <input type="radio" name="rdo1" value="rv2"> 점심
            <input type="radio" name="rdo1" value="rv3"> 저녁
            <input type="radio" name="rdo1" value="rv3"> 야식<br>
            <hr>
            <input type="hidden" name="hdn1" value="hv1">
            <hr>
            영수증
            <input type="file" name="f1" value=""><br>
            <input type="submit" name="smt1" value="보내기"><br>
            <input type="reset" name="rst1" value="초기화"><br>
        </form>
        <b>상당히 배고프다</b>
    </body>
</html>
